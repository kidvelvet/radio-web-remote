name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"  # Raspberry Pi OS Bookworm
          - os: ubuntu-latest
            python: "3.13"
    steps:
      # Actions pinned to commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # Same path a member without admin rights uses: uv inside a venv.
      - name: Install uv into .tools
        shell: bash
        run: |
          python -m venv .tools
          if [ -x .tools/bin/python ]; then T=.tools/bin; else T=.tools/Scripts; fi
          "$T/python" -m pip install --quiet uv
          # Native path (D:\a\... on Windows): PowerShell steps cannot use /d/a/...
          "$T/python" -c "import pathlib, sys; print(pathlib.Path(sys.executable).parent)" >> "$GITHUB_PATH"

      - name: Sync environment (locked)
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -o faulthandler_timeout=60

  e2e:
    name: browsers (chromium, firefox, webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv into .tools
        shell: bash
        run: |
          python -m venv .tools
          .tools/bin/python -m pip install --quiet uv
          .tools/bin/python -c "import pathlib, sys; print(pathlib.Path(sys.executable).parent)" >> "$GITHUB_PATH"

      - name: Sync environment (locked)
        run: uv sync --locked --python 3.12

      - name: Install browser engines
        run: uv run playwright install --with-deps chromium firefox webkit

      # The runner has no sound card; give the browsers a virtual one.
      - name: Virtual audio device
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null

      - name: Browser tests
        run: uv run pytest -m e2e --browser chromium --browser firefox --browser webkit -o faulthandler_timeout=120

  install:
    # The member's path: the one-line install script, then a smoke test of
    # the installed command (init, serve with the simulator, /setup, doctor).
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libportaudio2

      - name: install.sh
        if: runner.os != 'Windows'
        env:
          RWR_SOURCE: ${{ github.workspace }}
          RWR_PREFIX: ${{ runner.temp }}/rwr
          RWR_BIN: ${{ runner.temp }}/bin
          PYTHON: python
        run: |
          sh packaging/install.sh
          python tools/install_smoke.py "$RWR_BIN/radio-web-remote"
          sh packaging/install.sh --uninstall
          test ! -e "$RWR_BIN/radio-web-remote"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RWR_SOURCE: ${{ github.workspace }}
          RWR_PREFIX: ${{ runner.temp }}\rwr
          RWR_PYTHON: python
        run: |
          ./packaging/install.ps1
          python tools/install_smoke.py "$env:RWR_PREFIX\venv\Scripts\radio-web-remote.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/install.ps1 -Uninstall
          if (Test-Path "$env:RWR_PREFIX") { throw "uninstall left $env:RWR_PREFIX" }

  docker:
    name: docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f packaging/docker/Dockerfile -t radio-web-remote:ci .
      - name: Runs
        run: docker run --rm radio-web-remote:ci radio-web-remote drivers
